<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 7</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Dia</legend>

            <div>
                <input type="checkbox" name="domingo" id="domingo">
                <label for="domingo">Domingo</label>
            </div>

            <div>
                <input type="checkbox" name="segunda" id="segunda" checked>
                <label for="segunda">Segunda-feira</label>
            </div>

            <div>
                <input type="checkbox" name="terca" id="terca">
                <label for="terca">Terça-feira</label>
            </div>

            <div>
                <input type="checkbox" name="quarta" id="quarta">
                <label for="quarta">Quarta-feira</label>
            </div>

            <div>
                <input type="checkbox" name="quinta" id="quinta" checked>
                <label for="quinta">Quinta-feira</label>
            </div>

            <div>
                <input type="checkbox" name="sexta" id="sexta">
                <label for="sexta">Sexta-feira</label>
            </div>

            <div>
                <input type="checkbox" name="sabado" id="sabado">
                <label for="sabado">Sábado</label>
            </div>

            <br>
            <button type="submit">Enviar</button>
        </fieldset>
    </form>
</body>

</html>
